<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#141B19" />
  <meta name="description" content="Organizador de rotina diária com lembretes — KWIK" />
  <title>Rotina KWIK</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <g fill="#2BBE50">
            <polygon points="3,66.5 12.2,57 12.2,97 3,97" />
            <polygon points="16.5,47.2 29.6,36.2 29.6,97 16.5,97" />
            <polygon points="34.8,19.7 47.8,19.7 47.8,97 34.8,97" />
            <polygon points="47.8,47.2 79.1,15.9 72,8 97,3 92,30 88.1,25.7 47.8,66" />
            <polygon points="52.2,68 61.7,57.8 97,97 77.8,97" />
          </g>
          <rect x="3" y="3" width="94" height="94" fill="none" stroke="currentColor" stroke-width="6" />
        </svg>
        <div class="titles">
          <h1 id="title">Hoje</h1>
          <p id="subtitle"></p>
        </div>
        <button id="sync-ind" type="button" class="sync-ind" data-action="tab" data-tab="ajustes" hidden></button>
        <div id="ring" class="ring-wrap" aria-live="polite"></div>
      </div>
      <div id="search-wrap" class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" enterkeyhint="go" autocomplete="off"
               placeholder="O que você precisa fazer?" aria-label="Buscar ou criar atividade" />
        <button id="search-clear" class="search-clear" type="button" data-action="search-clear" aria-label="Limpar busca" hidden><span data-icon="x"></span></button>
      </div>
      <div class="deco-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="fab" type="button" class="btn fab" data-action="new" hidden><span data-icon="plus"></span>Nova atividade</button>

    <nav class="tabbar" id="tabbar">
      <button type="button" data-action="tab" data-tab="hoje"><span data-icon="list-checks"></span>Hoje</button>
      <button type="button" data-action="tab" data-tab="rotina"><span data-icon="calendar-clock"></span>Rotina</button>
      <button type="button" data-action="tab" data-tab="ajustes"><span data-icon="settings"></span>Ajustes</button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
